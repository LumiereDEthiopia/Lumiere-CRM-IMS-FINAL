<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a96e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Perfume bottle icon -->
  <g transform="translate(10, 10)">
    <rect x="8" y="18" width="14" height="20" rx="2" fill="url(#gold)" opacity="0.9"/>
    <rect x="11" y="12" width="8" height="8" rx="1" fill="url(#gold)" opacity="0.7"/>
    <rect x="13" y="6" width="4" height="7" rx="1" fill="url(#gold)" opacity="0.8"/>
    <circle cx="15" cy="22" r="3" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.5"/>
  </g>
  <!-- Text: LUMIERE -->
  <text x="50" y="30" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="300" fill="#1a1a2e" letter-spacing="3">LUMIERE</text>
  <!-- Text: PERFUME -->
  <text x="50" y="48" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="400" fill="#c9a96e" letter-spacing="5">PERFUME</text>
</svg>